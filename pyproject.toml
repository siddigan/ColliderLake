[project]
name = "colliderlake"
version = "2.0.0"
description = "Laptop-scale CMS Open Data lakehouse for Project RESONANCE."
requires-python = ">=3.11,<3.12"
dependencies = [
  "awkward>=2.6",
  "duckdb>=1.0",
  "hist>=2.7",
  "iminuit>=2.24",
  "matplotlib>=3.8",
  "mplhep>=0.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "typer>=0.12",
  "uproot>=5.3",
]

[project.scripts]
colliderlake = "src.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
